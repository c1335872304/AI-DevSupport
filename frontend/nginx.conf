server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker gives services a stable DNS name but an API container recreation
    # changes its IP. Resolve it at proxy time rather than caching the startup IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /proxy-ws/ {
        # With a variable-based proxy_pass, the trailing URI is not rewritten
        # like a literal upstream. Rewrite the public prefix explicitly so the
        # FastAPI WebSocket route receives /chat instead of / or /proxy-ws/chat.
        rewrite ^/proxy-ws/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 7200s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
