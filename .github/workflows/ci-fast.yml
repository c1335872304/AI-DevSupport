name: Fast CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q app scripts
      - name: Validate documentation links
        run: python scripts/check_docs.py --checkout
      - name: Check backend for critical Ruff errors
        run: python -m ruff check --select E9,F63,F7,F82 app scripts tests
      - name: Run offline backend tests
        run: python -m pytest tests -q
      - name: Verify refund and ticket approval demo
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_refund_sandbox_demo.py | tee "${{ runner.temp }}/support-approval-demo.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-approval-demo
          path: ${{ runner.temp }}/support-approval-demo.jsonl
      - name: Run offline customer-service demo
        env:
          PHASE_B_DATA_DIR: ${{ runner.temp }}/customer-demo-db
        run: python scripts/run_customer_service_demo.py --output "${{ runner.temp }}/customer-demo-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-demo-evidence
          path: ${{ runner.temp }}/customer-demo-evidence
      - name: Validate frozen evaluation inputs
        run: python scripts/check_phase4_inputs.py
      - name: Score diagnostic trajectories without a provider
        run: python scripts/evaluate_phase4_diagnosis.py --mode final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-trajectories
          path: backend/data/checkpoints/phase4/diagnosis-final.json

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check frontend
        run: pnpm typecheck
      - name: Build frontend
        run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install demo API dependencies
        run: python -m pip install -r ../backend/requirements.txt
      - name: Run browser approval demo
        timeout-minutes: 3
        run: |
          export REFUND_DEMO_BROWSER="$(command -v google-chrome)"
          "$REFUND_DEMO_BROWSER" --version
          pnpm exec playwright test -c approval-demo.playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: approval-browser-failure
          path: frontend/test-results/

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp backend/.env.example backend/.env
          docker compose config -q
